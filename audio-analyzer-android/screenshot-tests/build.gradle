plugins { id 'java' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.14.1') { exclude group: 'androidx.test'; exclude group: 'androidx.test.espresso'; exclude group: 'androidx.test.ext'; exclude group: 'androidx.annotation' }
    testCompileOnly files("$projectDir/deps/android-all-instrumented-14-robolectric-10818077-i7.jar")
    testRuntimeOnly files('/usr/lib/android-sdk/platforms/android-23/android.jar')
    testImplementation files(System.getenv('APP_CLASSES') ?: 'app-classes')
}
test {
    systemProperty 'robolectric.graphicsMode', 'NATIVE'
    systemProperty 'robolectric.enabledSdks', '34'
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', "$projectDir/deps"
    systemProperty 'shots.dir', System.getenv('SHOTS_DIR') ?: "$buildDir/shots"
    testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams true }
    maxHeapSize = '3g'
}
